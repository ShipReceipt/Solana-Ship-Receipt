name: Deploy public verifier

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check source syntax
        run: npm run check:syntax

      - name: Run tests
        run: npm test

      - name: Create sample receipt
        run: node src/cli.mjs sample --out sample.receipt.json

      - name: Validate deployment secret
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is required in the production environment."
            exit 1
          fi

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null

      - name: Wait for verifier health
        env:
          RENDER_SERVICE_URL: https://solana-ship-receipt.onrender.com
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$RENDER_SERVICE_URL/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Render deployment did not become healthy within five minutes."
          exit 1
