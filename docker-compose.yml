services:
  verifier:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "rm -f sample.receipt.json &&
      node src/cli.mjs sample --out sample.receipt.json &&
      node src/cli.mjs serve sample.receipt.json --host 0.0.0.0 --port 8787 --network --public"
    environment:
      NODE_ENV: production
    ports:
      - "8787:8787"
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - verifier-net

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - verifier
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - verifier-net

networks:
  verifier-net:
    driver: bridge
